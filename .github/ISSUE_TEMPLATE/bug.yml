name: Bug
description: 安装失败、hook 静默失效、问候不对、技能路由错
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: 命令、期望、实际输出
    validations:
      required: true
  - type: input
    id: hermes
    attributes:
      label: Hermes version
      placeholder: "hermes --version  (e.g. 0.21.5)"
    validations:
      required: true
  - type: input
    id: seagull
    attributes:
      label: Seagull version
      placeholder: "distribution.yaml version, e.g. 2.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows, Linux, macOS, WSL]
    validations:
      required: true
  - type: textarea
    id: plugins
    attributes:
      label: Plugin list (redact secrets)
      description: Output of `hermes -p seagull plugins list --plain --no-bundled`
